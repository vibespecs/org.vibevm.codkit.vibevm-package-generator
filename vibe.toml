[package]
name = "vibevm-package-generator"
group = "org.vibevm.codkit"
kind = "app"
version = "1.0.0"
epoch = 1
format = "normal"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "The renderer of the org.vibevm.codkit package manifests: vibevm-generate-package-codkit writes the vibe.toml of a pinned Codkit release from that release's own checksum file"
keywords = ["generator", "manifest", "render", "codkit", "packaging", "application"]

[compatibility]
min_vibe_version = "1.0.12"
requires_kinds = []

[application]
id = "vibevm-generate-package-codkit"
keywords = ["generator", "manifest", "codkit"]


[[installer_options]]
id = "linux-x64"
name = "Package generator for org.vibevm.codkit 1.0.0"
platform = "linux"
platform_name = "Linux"
arch = "x86_64"
arch_name = "Intel/AMD 64-bit"

[[installer_options.steps]]
id = "script"
title = "Write the renderer into the application root"
kind = "copy"
from = "payload/generate-package-codkit.py"
to = "generate-package-codkit.py"

[[installer_options.launchers]]
id = "vibevm-generate-package-codkit"
name = "vibevm-generate-package-codkit"
description = "Render the vibe.toml of an org.vibevm.codkit package on standard output"
executable = "command:python3"
args = ["$app_root/generate-package-codkit.py"]
kind = "command"
default = true

[[installer_options.public_commands]]
name = "vibevm-generate-package-codkit"
launcher = "vibevm-generate-package-codkit"


